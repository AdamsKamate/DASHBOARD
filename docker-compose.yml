services:
  server:
    build: ./server
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      - DATABASE_URL=postgres://dashboard:dashboard@db:5432/dashboard
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./server/src:/app/src
    restart: unless-stopped

  client_web:
    build: ./client_web
    ports:
      - "8081:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - server
    volumes:
      - ./client_web/src:/app/src
    restart: unless-stopped

  # The worker remains declared but disabled while jobs/worker.ts is empty
  # (Phase 3). Enable it by removing the profile once BullMQ is connected.
  worker:
    build: ./server
    command: ["npm", "run", "worker"]
    profiles: ["phase3"]
    env_file: .env
    environment:
      - DATABASE_URL=postgres://dashboard:dashboard@db:5432/dashboard
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=dashboard
      - POSTGRES_PASSWORD=dashboard
      - POSTGRES_DB=dashboard
    volumes:
      - db_data:/var/lib/postgresql/data
      # No initdb mount: the schema is now applied by the migration runner
      # when the server starts (server/src/db/migrate.ts).
      # This means schema changes no longer require `down -v`, which
      # would delete all data.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Development SMTP server. Captures all outgoing emails instead of
  # delivering them, and shows them in a web UI on port 8025.
  # Chosen over Mailtrap or Ethereal: no external account to create, so
  # the project stays testable by a grader with zero configuration.
  mailhog:
    image: mailhog/mailhog:latest
    ports:
      - "8025:8025"   # web UI
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db_data:
  redis_data: